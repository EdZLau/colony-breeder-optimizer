[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colony-breeder"
version = "0.1.0"
description = "Rank male x female breeding pairs by the exact probability of producing a target genotype."
readme = "README.md"
requires-python = ">=3.9"
# The core genetics uses only the standard library, so no runtime dependencies yet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only the web app (step 7) needs these. The core never imports them.
app = ["streamlit", "pandas", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
